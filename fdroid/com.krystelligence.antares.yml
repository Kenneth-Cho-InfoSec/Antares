Categories:
  - Internet
License: MPL-2.0
AuthorName: Kenneth Cho
SourceCode: https://github.com/Kenneth-Cho-InfoSec/Antares
IssueTracker: https://github.com/Kenneth-Cho-InfoSec/Antares/issues

AutoName: Antares Engine
Summary: Experimental Servo browser core for Solipsism
Description: |-
  Antares is the optional, experimental Servo-based browser core for Solipsism Browser.
  It runs in a separate app process and is installed separately so WebView users do not store
  the native engine.

RepoType: git
Repo: https://github.com/Kenneth-Cho-InfoSec/Antares.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    srclibs:
      - rustup@1.28.2
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake curl git libdbus-1-dev libfontconfig1-dev
        libfreetype6-dev libgl1-mesa-dri libgles2-mesa-dev libglib2.0-dev libgstreamer-plugins-base1.0-dev
        libgstreamer1.0-dev libharfbuzz-dev libssl-dev libunwind-dev libx11-dev m4 pkg-config
        python3 python3-pip
    prebuild:
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.97.1 --target aarch64-linux-android
        --component rust-src rustfmt
      - source $HOME/.cargo/env
      - python3 -m venv .fdroid-python
      - .fdroid-python/bin/pip install uv==0.12.5
    build:
      - source $HOME/.cargo/env
      - export PATH="$PWD/.fdroid-python/bin:$PATH"
      - export ANDROID_NDK_ROOT=$$NDK$$
      - ./mach build --locked --target aarch64-linux-android --release
    output: target/aarch64-linux-android/release/servoapp.apk
    ndk: 28.2.13676358

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
